<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Notes - Dark Mode</title>

  <!-- Google Fonts & Material Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <style>
    :root {
      /* Material 3 Dark Theme Colors */
      --md-sys-color-surface: #131314;
      --md-sys-color-surface-container: #1e1f20;
      --md-sys-color-surface-container-high: #2b2f31;
      --md-sys-color-on-surface: #e2e2e2;
      --md-sys-color-on-surface-variant: #c4c7c5;
      
      --md-sys-color-primary: #a8c7fa;
      --md-sys-color-primary-container: #004a77;
      --md-sys-color-on-primary-container: #c2e7ff;
      
      --md-sys-color-outline: #8e918f;
      --md-sys-color-error: #ffb4ab;
      --md-sys-color-error-container: #93000a;
      
      --hover-bg: rgba(255, 255, 255, 0.08);
      --ripple-opacity: 0.12;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: 'Roboto', system-ui, -apple-system, sans-serif;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      height: 100vh;
      overflow: hidden;
      color-scheme: dark;
    }

    /* Scrollbar for Dark Mode */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #444746;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #5f6368;
    }

    /* Guaranteed Ripple Expansion */
    .ripple-effect {
      position: relative;
      overflow: hidden;
    }
    
    .ripple-span {
      position: absolute;
      border-radius: 50%;
      background-color: currentColor;
      opacity: 0;
      transform: scale(0);
      pointer-events: none;
      /* 600ms expansion, 300ms fadeout */
      transition: transform 600ms cubic-bezier(0.4, 0, 0.2, 1), opacity 300ms linear;
    }

    .ripple-span.ripple-animate-in {
      transform: scale(2.5); /* Scale large enough to always hit far corners */
      opacity: var(--ripple-opacity);
    }

    .ripple-span.ripple-animate-out {
      opacity: 0;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 320px;
      background: var(--md-sys-color-surface);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .sidebar-header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 500;
      font-family: 'Product Sans', 'Roboto', sans-serif;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--md-sys-color-on-surface);
    }

    .new-note {
      align-self: flex-start;
      border: 0;
      border-radius: 16px; 
      padding: 16px 24px 16px 16px;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-primary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .new-note:hover {
      background: #33383a;
      box-shadow: 0 1px 3px 0 rgba(0,0,0,0.3), 0 4px 8px 3px rgba(0,0,0,0.15);
    }

    .notes {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .note-item {
      padding: 16px;
      border-radius: 24px;
      cursor: pointer;
      transition: background-color 0.2s;
      user-select: none;
    }

    .note-item:hover {
      background: var(--hover-bg);
    }

    .note-item.active {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    .note-title {
      font-weight: 500;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .note-preview {
      color: var(--md-sys-color-on-surface-variant);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-item.active .note-preview {
      color: rgba(194, 231, 255, 0.8);
    }

    /* Editor */
    .editor {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--md-sys-color-surface-container);
      border-radius: 24px;
      margin: 16px 16px 16px 0;
      overflow: hidden; 
    }

    .toolbar {
      height: 72px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 24px;
    }

    .toolbar input {
      flex: 1;
      border: 0;
      outline: none;
      font-size: 24px;
      font-weight: 400;
      font-family: 'Product Sans', 'Roboto', sans-serif;
      min-width: 0;
      background: transparent;
      color: var(--md-sys-color-on-surface);
    }

    .toolbar input::placeholder {
      color: var(--md-sys-color-outline);
    }

    .icon-btn {
      border: none;
      background: transparent;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--md-sys-color-on-surface-variant);
      transition: background-color 0.2s, color 0.2s;
    }

    .icon-btn:hover {
      background: var(--hover-bg);
      color: var(--md-sys-color-on-surface);
    }

    #deleteButton {
      color: var(--md-sys-color-outline);
    }
    
    #deleteButton:hover {
      background: rgba(255, 180, 171, 0.12);
      color: var(--md-sys-color-error);
    }

    textarea {
      flex: 1;
      width: 100%;
      border: 0;
      outline: none;
      resize: none;
      padding: 0 24px 24px 24px;
      background: transparent;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.6;
      color: var(--md-sys-color-on-surface);
    }
    
    textarea::placeholder {
      color: var(--md-sys-color-outline);
    }

    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: var(--md-sys-color-on-surface-variant);
    }

    .empty span.material-symbols-outlined {
      font-size: 72px;
      color: var(--md-sys-color-surface-container-high);
      margin-bottom: 24px;
    }

    .empty h2 {
      color: var(--md-sys-color-on-surface);
      margin: 0 0 8px;
      font-weight: 400;
      font-size: 24px;
      font-family: 'Product Sans', sans-serif;
    }

    /* Google-style Snackbar */
    .status {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #e2e2e2;
      color: #131314;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 3px 5px -1px rgba(0,0,0,.2), 0 6px 10px 0 rgba(0,0,0,.14), 0 1px 18px 0 rgba(0,0,0,.12);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
    }

    .status.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Custom Material Dialog */
    .md-dialog {
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      border: none;
      border-radius: 28px;
      padding: 24px;
      width: 90%;
      max-width: 320px;
      box-shadow: 0 24px 38px 3px rgba(0,0,0,0.14), 0 9px 46px 8px rgba(0,0,0,0.12), 0 11px 15px -7px rgba(0,0,0,0.2);
    }

    .md-dialog::backdrop {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
    }

    .md-dialog-title {
      margin: 0 0 16px;
      font-size: 24px;
      font-weight: 400;
      font-family: 'Product Sans', sans-serif;
    }

    .md-dialog-desc {
      margin: 0 0 24px;
      font-size: 14px;
      color: var(--md-sys-color-on-surface-variant);
      line-height: 1.5;
    }

    .md-dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .text-btn {
      background: transparent;
      border: none;
      color: var(--md-sys-color-primary);
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
    }

    .text-btn.error {
      color: var(--md-sys-color-error);
    }

    .text-btn:hover {
      background: var(--hover-bg);
    }

    @media (max-width: 700px) {
      .app {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: 35%;
      }
      .editor {
        margin: 0;
        border-radius: 24px 24px 0 0;
      }
      .toolbar {
        padding: 0 16px;
      }
      textarea {
        padding: 0 16px 16px 16px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>
        <span class="material-symbols-outlined" style="color: var(--md-sys-color-primary);">description</span>
        Notes
      </h1>
      <button class="new-note ripple-effect" id="newNoteButton">
        <span class="material-symbols-outlined">add</span>
        New Note
      </button>
    </div>

    <div class="notes" id="notesList"></div>
  </aside>

  <main class="editor">

    <div id="emptyState" class="empty">
      <span class="material-symbols-outlined">edit_note</span>
      <h2>No note selected</h2>
      <p>Create a note to get started.</p>
    </div>

    <div id="noteEditor" style="display:none; height:100%; flex-direction:column;">

      <div class="toolbar">
        <input
          id="titleInput"
          type="text"
          placeholder="Untitled note"
          autocomplete="off"
        >

        <button class="icon-btn ripple-effect" id="copyButton" title="Copy note URL">
          <span class="material-symbols-outlined">link</span>
        </button>

        <button class="icon-btn ripple-effect" id="deleteButton" title="Delete note">
          <span class="material-symbols-outlined">delete</span>
        </button>
      </div>

      <textarea
        id="contentInput"
        placeholder="Start writing..."
        spellcheck="true"
      ></textarea>

    </div>

  </main>
</div>

<!-- Snackbar -->
<div class="status" id="status">
  <span id="statusIcon" class="material-symbols-outlined" style="font-size: 20px; color: #0b57d0;">check_circle</span>
  <span id="statusText">Saved</span>
</div>

<!-- Material Dialog -->
<dialog id="deleteDialog" class="md-dialog">
  <div class="md-dialog-content">
    <h3 class="md-dialog-title">Delete note?</h3>
    <p class="md-dialog-desc">This note will be permanently deleted. This action cannot be undone.</p>
  </div>
  <div class="md-dialog-actions">
    <button id="cancelDeleteBtn" class="text-btn ripple-effect">Cancel</button>
    <button id="confirmDeleteBtn" class="text-btn error ripple-effect">Delete</button>
  </div>
</dialog>

<script>
  /*
    -------------------------
    Advanced Ripple Effect Handler (Guaranteed Expansion)
    -------------------------
  */
  document.addEventListener('pointerdown', function(e) {
    const target = e.target.closest('.ripple-effect');
    if (!target) return;
    
    const rect = target.getBoundingClientRect();
    const diameter = Math.max(rect.width, rect.height); 
    const radius = diameter / 2;
    
    const circle = document.createElement('span');
    circle.classList.add('ripple-span');
    circle.style.width = circle.style.height = `${diameter}px`;
    circle.style.left = `${e.clientX - rect.left - radius}px`;
    circle.style.top = `${e.clientY - rect.top - radius}px`;
    
    target.appendChild(circle);
    
    const startTime = Date.now();
    
    requestAnimationFrame(() => {
      circle.classList.add('ripple-animate-in');
    });

    const removeRipple = () => {
      const timeElapsed = Date.now() - startTime;
      
      // Calculate delay. Force the ripple to stay alive for a minimum of 450ms.
      // This guarantees the expansion animation reaches the edges even if you
      // click and release very rapidly.
      const delay = Math.max(0, 450 - timeElapsed);
      
      setTimeout(() => {
        circle.classList.add('ripple-animate-out');
        // Wait 300ms for the fade-out CSS transition to finish before removing from DOM
        setTimeout(() => circle.remove(), 300);
      }, delay);
      
      // Clean up listeners
      window.removeEventListener('pointerup', removeRipple);
      target.removeEventListener('pointerleave', removeRipple);
    };

    window.addEventListener('pointerup', removeRipple);
    target.addEventListener('pointerleave', removeRipple);
  });

  const STORAGE_KEY = "local-notes-app";

  const notesList = document.getElementById("notesList");
  const newNoteButton = document.getElementById("newNoteButton");
  const emptyState = document.getElementById("emptyState");
  const noteEditor = document.getElementById("noteEditor");
  const titleInput = document.getElementById("titleInput");
  const contentInput = document.getElementById("contentInput");
  const deleteButton = document.getElementById("deleteButton");
  const copyButton = document.getElementById("copyButton");
  const status = document.getElementById("status");
  const statusText = document.getElementById("statusText");
  
  // Dialog Elements
  const deleteDialog = document.getElementById("deleteDialog");
  const cancelDeleteBtn = document.getElementById("cancelDeleteBtn");
  const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");

  let notes = loadNotes();
  let currentNoteId = getNoteIdFromURL();

  /* ------------------------- LocalStorage ------------------------- */
  function loadNotes() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : {};
    } catch (error) {
      console.error("Could not load notes:", error);
      return {};
    }
  }

  function saveNotes() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    showStatus("Saved");
  }

  /* ------------------------- URL handling ------------------------- */
  function getNoteIdFromURL() {
    const params = new URLSearchParams(window.location.search);
    return params.get("note");
  }

  function setNoteURL(id) {
    const url = new URL(window.location.href);
    if (id) {
      url.searchParams.set("note", id);
    } else {
      url.searchParams.delete("note");
    }
    history.pushState({}, "", url);
  }

  /* ------------------------- Note Operations ------------------------- */
  function generateNoteId() {
    return Date.now().toString(36) + Math.random().toString(36).substring(2, 8);
  }

  function createNote() {
    const id = generateNoteId();
    notes[id] = {
      id: id,
      title: "",
      content: "",
      created: Date.now(),
      updated: Date.now()
    };
    saveNotes();
    openNote(id);
    renderNotes(); // Full render to insert new note at top
    titleInput.focus();
  }

  function openNote(id) {
    if (!notes[id]) {
      showEmpty();
      return;
    }
    currentNoteId = id;
    const note = notes[id];
    titleInput.value = note.title;
    contentInput.value = note.content;
    emptyState.style.display = "none";
    noteEditor.style.display = "flex";
    setNoteURL(id);
    
    // Update active class without nuking the DOM (fixes ripple cutoff)
    const items = document.querySelectorAll('.note-item');
    items.forEach(item => {
      if (item.dataset.id === id) {
        item.classList.add('active');
      } else {
        item.classList.remove('active');
      }
    });
  }

  function showEmpty() {
    currentNoteId = null;
    emptyState.style.display = "flex";
    noteEditor.style.display = "none";
    
    const items = document.querySelectorAll('.note-item');
    items.forEach(item => item.classList.remove('active'));
  }

  function updateCurrentNote() {
    if (!currentNoteId || !notes[currentNoteId]) return;
    notes[currentNoteId].title = titleInput.value;
    notes[currentNoteId].content = contentInput.value;
    notes[currentNoteId].updated = Date.now();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    
    renderNotes(); // Re-render to sort by updated time
    showStatus("Saved");
  }

  /* ------------------------- Custom Dialog Logic ------------------------- */
  deleteButton.addEventListener("click", () => {
    if (!currentNoteId || !notes[currentNoteId]) return;
    deleteDialog.showModal();
  });

  cancelDeleteBtn.addEventListener("click", () => {
    deleteDialog.close();
  });

  confirmDeleteBtn.addEventListener("click", () => {
    deleteDialog.close();
    deleteCurrentNote();
  });

  // Close dialog on backdrop click
  deleteDialog.addEventListener("click", (e) => {
    const dialogDimensions = deleteDialog.getBoundingClientRect();
    if (
      e.clientX < dialogDimensions.left ||
      e.clientX > dialogDimensions.right ||
      e.clientY < dialogDimensions.top ||
      e.clientY > dialogDimensions.bottom
    ) {
      deleteDialog.close();
    }
  });

  function deleteCurrentNote() {
    if (!currentNoteId || !notes[currentNoteId]) return;
    
    delete notes[currentNoteId];
    saveNotes();
    setNoteURL(null);
    
    renderNotes(); // Full render after deletion
    
    const remainingIds = Object.keys(notes);
    if (remainingIds.length > 0) {
      openNote(remainingIds[0]);
    } else {
      showEmpty();
    }
    
    showStatus("Note deleted");
  }

  /* ------------------------- Render sidebar ------------------------- */
  function renderNotes() {
    notesList.innerHTML = "";
    const noteArray = Object.values(notes).sort((a, b) => b.updated - a.updated);

    for (const note of noteArray) {
      const item = document.createElement("div");
      item.className = "note-item ripple-effect"; 
      item.dataset.id = note.id; // Crucial for tracking active state smoothly
      
      if (note.id === currentNoteId) {
        item.classList.add("active");
      }

      const title = document.createElement("div");
      title.className = "note-title";
      title.textContent = note.title || "Untitled Note";

      const preview = document.createElement("div");
      preview.className = "note-preview";
      preview.textContent = note.content ? note.content.replace(/\s+/g, " ").trim() : "No additional text";

      item.appendChild(title);
      item.appendChild(preview);

      item.addEventListener("click", () => {
        openNote(note.id);
      });

      notesList.appendChild(item);
    }
  }

  /* ------------------------- Utility ------------------------- */
  async function copyNoteURL() {
    if (!currentNoteId) return;
    const url = window.location.href;
    try {
      await navigator.clipboard.writeText(url);
      showStatus("Link copied to clipboard");
    } catch (error) {
      const input = document.createElement("input");
      input.value = url;
      document.body.appendChild(input);
      input.select();
      document.execCommand("copy");
      input.remove();
      showStatus("Link copied to clipboard");
    }
  }

  let statusTimeout;
  function showStatus(message) {
    statusText.textContent = message;
    status.classList.add("show");
    clearTimeout(statusTimeout);
    statusTimeout = setTimeout(() => {
      status.classList.remove("show");
    }, 3000); 
  }

  /* ------------------------- Event listeners ------------------------- */
  newNoteButton.addEventListener("click", createNote);
  titleInput.addEventListener("input", updateCurrentNote);
  contentInput.addEventListener("input", updateCurrentNote);
  copyButton.addEventListener("click", copyNoteURL);

  window.addEventListener("popstate", () => {
    const id = getNoteIdFromURL();
    if (id && notes[id]) {
      openNote(id);
    } else {
      showEmpty();
    }
  });

  /* ------------------------- Start app ------------------------- */
  renderNotes();
  if (currentNoteId && notes[currentNoteId]) {
    openNote(currentNoteId);
  } else {
    showEmpty();
  }
</script>

</body>
</html>
